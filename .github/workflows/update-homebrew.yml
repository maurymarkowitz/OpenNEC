name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to use (e.g. v2.2.0)'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Create deterministic tarball from tag
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          git fetch origin refs/tags/${TAG}:refs/tags/${TAG}
          git archive --prefix=OpenNEC-${TAG}/ --format=tar.gz refs/tags/${TAG} > source.tar.gz

      - name: Compute SHA256
        id: sha
        run: |
          echo "sha=$(sha256sum source.tar.gz | cut -d ' ' -f1)" >> $GITHUB_OUTPUT

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: maurymarkowitz/homebrew-tap
          token: ${{ secrets.HOMEBREW_AND_SCOOP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_AND_SCOOP_TOKEN }}
        run: |
          cd homebrew-tap

          TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          url="https://github.com/maurymarkowitz/OpenNEC/archive/refs/tags/${TAG}.tar.gz"
          sha="${{ steps.sha.outputs.sha }}"

          TOKEN="${{ secrets.HOMEBREW_AND_SCOOP_TOKEN }}"
          TOKEN="$(printf '%s' "${TOKEN}" | tr -d '\r\n')"

          sed -i "s|^  url \".*\"|  url \"${url}\"|" Formula/onec.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" Formula/onec.rb

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/maurymarkowitz/homebrew-tap.git"

          git add Formula/onec.rb
          git commit -m "Update onec to ${TAG}"
          git push