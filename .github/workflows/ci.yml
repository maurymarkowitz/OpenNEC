name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libopenblas-dev liblapack-dev gfortran
      - name: Build
        run: |
          make clean
          make RELEASE=1 BACKEND=openblas
      - name: Smoke test
        run: |
          ./onec examples/example5.nec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onec-linux-openblas
          path: onec

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMP
        run: brew install libomp
      - name: Build
        run: |
          make clean
          make RELEASE=1 OPENMP=1 OPENMP_CFLAGS="-I$(brew --prefix libomp)/include -fopenmp" OPENMP_LDFLAGS="-L$(brew --prefix libomp)/lib -lomp"
      - name: Smoke test
        run: |
          ./onec examples/example5.nec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onec-macos
          path: onec

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2 / MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            make
      - name: Build (MINGW64)
        shell: bash -l {0}
        run: |
          make clean
          make RELEASE=1 BACKEND=original CC=x86_64-w64-mingw32-gcc
      - name: Smoke test (MINGW64)
        shell: bash -l {0}
        run: |
          ./onec.exe examples/example5.nec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onec-windows
          path: onec.exe

  test-golden:
    name: Golden Impedance Tests
    needs: build-linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [golden-impedance, golden-open-issues]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas0 liblapack3 python3
      
      - name: Download onec binary
        uses: actions/download-artifact@v4
        with:
          name: onec-linux-openblas
      
      - name: Run test suite
        run: |
          chmod +x onec
          python3 tests/run_ci_tests.py --onec ./onec --suite "${{ matrix.suite }}" --verbose
        continue-on-error: ${{ matrix.suite == 'golden-open-issues' }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: tests/golden_tests/decks/*.out
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Verify cleanup
        if: always()
        run: |
          if ls /tmp/golden-* 1> /dev/null 2>&1; then
            echo "ERROR: Temporary test directories not cleaned up"
            ls -la /tmp/golden-*
            exit 1
          fi
          echo "✓ All temporary test directories cleaned up"
