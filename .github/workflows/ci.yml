name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libopenblas-dev liblapack-dev gfortran
      - name: Build
        run: |
          make clean
          make RELEASE=1 BACKEND=openblas
      - name: Smoke test
        run: |
          ./onec examples/example5.nec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onec-linux-openblas
          path: onec

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make clean
          make RELEASE=1
      - name: Smoke test
        run: |
          ./onec examples/example5.nec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onec-macos
          path: onec

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2 / MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openblas
            pkgconf
            make
      - name: Debug MSYS2 environment
        shell: bash -l {0}
        run: |
          echo "=== MSYS2 Environment ==="
          echo "MSYSTEM: $MSYSTEM"
          echo "MSYSTEM_PREFIX: $MSYSTEM_PREFIX"
          echo "PATH: $PATH"
          echo ""
          echo "=== pkg-config test ==="
          pkg-config --list-all | grep -i openblas || echo "No openblas in pkg-config"
          echo ""
          echo "=== pkg-config OpenBLAS flags ==="
          pkg-config --cflags --libs openblas 2>/dev/null || echo "pkg-config failed"
          echo ""
          echo "=== Search for libopenblas ==="
          find /mingw64 -name "libopenblas*" 2>/dev/null | head -5
      - name: Build (MINGW64 with OpenBLAS)
        shell: bash -l {0}
        run: |
          make clean
          make RELEASE=1 BACKEND=openblas CC=x86_64-w64-mingw32-gcc
      - name: Smoke test (MINGW64)
        shell: bash -l {0}
        run: |
          ./onec.exe examples/example5.nec
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: onec-windows
          path: onec.exe
