name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload assets to (e.g. v1.1.3)'
        required: true
        type: string

# Allow the workflow to upload release assets
permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [original, openblas]
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libopenblas-dev liblapack-dev gfortran zip
      - name: Set build vars
        run: |
          if [ "${{ matrix.backend }}" = "original" ]; then
            echo "DIST_SUFFIX=" >> $GITHUB_ENV
            echo "MAKE_OPTS=BACKEND=original" >> $GITHUB_ENV
          else
            echo "DIST_SUFFIX=-${{ matrix.backend }}" >> $GITHUB_ENV
            echo "MAKE_OPTS=BACKEND=${{ matrix.backend }} STATIC_BLAS=1" >> $GITHUB_ENV
          fi
      - name: Build (x86_64, ${{ matrix.backend }})
        run: |
          make clean
          make RELEASE=1 $MAKE_OPTS
      - name: Package
        run: |
          DIST="onec-linux-x86_64${DIST_SUFFIX}"
          mkdir -p "dist/${DIST}/lib" "dist/${DIST}/include" "dist/${DIST}/bin"
          cp onec "dist/${DIST}/bin/"
          cp README.MD "dist/${DIST}/"
          cp examples/example5.nec "dist/${DIST}/"
          cp libonec.a "dist/${DIST}/lib/"
          cp src/opennec.h src/types.h src/deck.h src/input.h src/output.h \
             src/geometry.h src/control.h src/fields.h src/ground.h \
             src/calculations.h src/matrix.h src/network.h src/radiation.h \
             src/somnec.h src/misc.h "dist/${DIST}/include/"
          cp -r docs "dist/${DIST}/"
          cp -r examples "dist/${DIST}/"
          cd dist && zip -r "${DIST}.zip" "${DIST}/"
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" "dist/onec-linux-x86_64${DIST_SUFFIX}.zip" --clobber

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        backend: [original, openblas]
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libopenblas-dev liblapack-dev gfortran zip
      - name: Set build vars
        run: |
          if [ "${{ matrix.backend }}" = "original" ]; then
            echo "DIST_SUFFIX=" >> $GITHUB_ENV
            echo "MAKE_OPTS=BACKEND=original" >> $GITHUB_ENV
          else
            echo "DIST_SUFFIX=-${{ matrix.backend }}" >> $GITHUB_ENV
            echo "MAKE_OPTS=BACKEND=${{ matrix.backend }} STATIC_BLAS=1" >> $GITHUB_ENV
          fi
      - name: Build (aarch64, ${{ matrix.backend }})
        run: |
          make clean
          make RELEASE=1 $MAKE_OPTS
      - name: Package
        run: |
          DIST="onec-linux-aarch64${DIST_SUFFIX}"
          mkdir -p "dist/${DIST}/lib" "dist/${DIST}/include" "dist/${DIST}/bin"
          cp onec "dist/${DIST}/bin/"
          cp README.MD "dist/${DIST}/"
          cp examples/example5.nec "dist/${DIST}/"
          cp libonec.a "dist/${DIST}/lib/"
          cp src/opennec.h src/types.h src/deck.h src/input.h src/output.h \
             src/geometry.h src/control.h src/fields.h src/ground.h \
             src/calculations.h src/matrix.h src/network.h src/radiation.h \
             src/somnec.h src/misc.h "dist/${DIST}/include/"
          cp -r docs "dist/${DIST}/"
          cp -r examples "dist/${DIST}/"
          cd dist && zip -r "${DIST}.zip" "${DIST}/"
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" "dist/onec-linux-aarch64${DIST_SUFFIX}.zip" --clobber

  build-macos-x86:
    runs-on: macos-latest
    strategy:
      matrix:
        backend: [original, accelerate]
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMP
        run: brew install libomp
      - name: Set build vars
        run: |
          if [ "${{ matrix.backend }}" = "original" ]; then
            echo "DIST_SUFFIX=" >> $GITHUB_ENV
            echo "MAKE_OPTS=BACKEND=original" >> $GITHUB_ENV
          else
            echo "DIST_SUFFIX=-${{ matrix.backend }}" >> $GITHUB_ENV
            echo "MAKE_OPTS=BACKEND=${{ matrix.backend }}" >> $GITHUB_ENV
          fi
      - name: Build (macOS x86_64, ${{ matrix.backend }})
        run: |
          make clean
          make RELEASE=1 CC=clang CFLAGS="-I. -Isrc -O2 -Wall -Wno-unused-parameter -arch x86_64 -mmacosx-version-min=11.0" LDFLAGS="-arch x86_64 -mmacosx-version-min=11.0" OPENMP=1 OPENMP_CFLAGS="-I$(brew --prefix libomp)/include -fopenmp" OPENMP_LDFLAGS="-L$(brew --prefix libomp)/lib -lomp" $MAKE_OPTS
      - name: Package
        run: |
          DIST="onec-macos-x86${DIST_SUFFIX}"
          mkdir -p "dist/${DIST}/lib" "dist/${DIST}/include" "dist/${DIST}/bin"
          cp onec "dist/${DIST}/bin/"
          cp README.MD "dist/${DIST}/"
          cp examples/example5.nec "dist/${DIST}/"
          cp libonec.a "dist/${DIST}/lib/"
          cp src/opennec.h src/types.h src/deck.h src/input.h src/output.h \
             src/geometry.h src/control.h src/fields.h src/ground.h \
             src/calculations.h src/matrix.h src/network.h src/radiation.h \
             src/somnec.h src/misc.h "dist/${DIST}/include/"
          cp -r docs "dist/${DIST}/"
          cp -r examples "dist/${DIST}/"
          cd dist && zip -r "${DIST}.zip" "${DIST}/"
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" "dist/onec-macos-x86${DIST_SUFFIX}.zip" --clobber

  build-macos-arm64:
    runs-on: macos-latest
    name: Build macOS (arm64, ${{ matrix.backend }})
    strategy:
      matrix:
        backend: [original, accelerate]
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMP
        run: brew install libomp
      - name: Show runner arch
        run: |
          uname -m || true
          sysctl -n hw.machine || true
      - name: Set build vars
        run: |
          if [ "${{ matrix.backend }}" = "original" ]; then
            echo "DIST_SUFFIX=" >> $GITHUB_ENV
            echo "MAKE_OPTS=BACKEND=original" >> $GITHUB_ENV
          else
            echo "DIST_SUFFIX=-${{ matrix.backend }}" >> $GITHUB_ENV
            echo "MAKE_OPTS=BACKEND=${{ matrix.backend }}" >> $GITHUB_ENV
          fi
      - name: Build (macOS arm64, ${{ matrix.backend }})
        run: |
          make clean
          make RELEASE=1 CC=clang CFLAGS="-I. -Isrc -O2 -Wall -Wno-unused-parameter -arch arm64 -mmacosx-version-min=11.0" LDFLAGS="-arch arm64 -mmacosx-version-min=11.0" OPENMP=1 OPENMP_CFLAGS="-I$(brew --prefix libomp)/include -fopenmp" OPENMP_LDFLAGS="-L$(brew --prefix libomp)/lib -lomp" $MAKE_OPTS
      - name: Package
        run: |
          DIST="onec-macos-arm64${DIST_SUFFIX}"
          mkdir -p "dist/${DIST}/lib" "dist/${DIST}/include" "dist/${DIST}/bin"
          cp onec "dist/${DIST}/bin/"
          cp README.MD "dist/${DIST}/"
          cp examples/example5.nec "dist/${DIST}/"
          cp libonec.a "dist/${DIST}/lib/"
          cp src/opennec.h src/types.h src/deck.h src/input.h src/output.h \
             src/geometry.h src/control.h src/fields.h src/ground.h \
             src/calculations.h src/matrix.h src/network.h src/radiation.h \
             src/somnec.h src/misc.h "dist/${DIST}/include/"
          cp -r docs "dist/${DIST}/"
          cp -r examples "dist/${DIST}/"
          cd dist && zip -r "${DIST}.zip" "${DIST}/"
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" "dist/onec-macos-arm64${DIST_SUFFIX}.zip" --clobber

  build-windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2/MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openblas
            pkgconf
            make
      - name: Build (MINGW64, original)
        shell: bash -l {0}
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          make clean
          make RELEASE=1 LDFLAGS="-static" CC=x86_64-w64-mingw32-gcc BACKEND=original
      - name: Package
        shell: bash -l {0}
        run: |
          DIST="onec-windows-x86_64"
          mkdir -p "dist/${DIST}/lib" "dist/${DIST}/include" "dist/${DIST}/bin"
          cp onec.exe "dist/${DIST}/bin/"
          cp README.MD "dist/${DIST}/"
          cp examples/example5.nec "dist/${DIST}/"
          cp libonec.a "dist/${DIST}/lib/"
          cp src/opennec.h src/types.h src/deck.h src/input.h src/output.h \
             src/geometry.h src/control.h src/fields.h src/ground.h \
             src/calculations.h src/matrix.h src/network.h src/radiation.h \
             src/somnec.h src/misc.h "dist/${DIST}/include/"
          cp -r docs "dist/${DIST}/"
          cp -r examples "dist/${DIST}/"
          powershell.exe -NoProfile -Command "Compress-Archive -Path \"dist/${DIST}/*\" -DestinationPath \"dist/${DIST}.zip\" -Force"
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -l {0}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" "dist/onec-windows-x86_64.zip" --clobber

  build-windows-mingw-openblas:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2/MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            make
            git
      - name: Build OpenBLAS locally
        shell: bash -l {0}
        run: |
          cd /tmp
          git clone --depth 1 https://github.com/OpenMathLib/OpenBLAS.git
          cd OpenBLAS
          # Build static library only, no shared
          make BINARY=64 ONLY_CBLAS=1 NO_SHARED=1 -j$(nproc)
          # Install to a known local location (avoid system paths)
          make PREFIX=/tmp/openblas-build install
          echo "=== OpenBLAS installation ==="
          ls -lh /tmp/openblas-build/lib/libopenblas.a
          ls -lh /tmp/openblas-build/include/openblas.h
      - name: Build OpenNEC with local OpenBLAS
        shell: bash -l {0}
        run: |
          # Use the locally built OpenBLAS by setting MINGW_OPENBLAS_PREFIX
          # This makes the Makefile find the library in /tmp/openblas-build instead of /mingw64
          make clean
          make RELEASE=1 \
            CC=x86_64-w64-mingw32-gcc \
            BACKEND=openblas \
            MINGW_OPENBLAS_PREFIX=/tmp/openblas-build
      - name: Package
        shell: bash -l {0}
        run: |
          DIST="onec-windows-x86_64-openblas"
          mkdir -p "dist/${DIST}/lib" "dist/${DIST}/include" "dist/${DIST}/bin"
          cp onec.exe "dist/${DIST}/bin/"
          # Copy libopenblas.dll from MSYS2
          if [ -f "D:/a/_temp/msys64/mingw64/bin/libopenblas.dll" ]; then
            cp "D:/a/_temp/msys64/mingw64/bin/libopenblas.dll" "dist/${DIST}/bin/"
          else
            echo "WARNING: libopenblas.dll not found at expected path"
          fi
          cp README.MD "dist/${DIST}/"
          cp examples/example5.nec "dist/${DIST}/"
          cp libonec.a "dist/${DIST}/lib/"
          cp src/opennec.h src/types.h src/deck.h src/input.h src/output.h \
             src/geometry.h src/control.h src/fields.h src/ground.h \
             src/calculations.h src/matrix.h src/network.h src/radiation.h \
             src/somnec.h src/misc.h "dist/${DIST}/include/"
          cp -r docs "dist/${DIST}/"
          cp -r examples "dist/${DIST}/"
          powershell.exe -NoProfile -Command "Compress-Archive -Path \"dist/${DIST}/*\" -DestinationPath \"dist/${DIST}.zip\" -Force"
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -l {0}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" "dist/onec-windows-x86_64-openblas.zip" --clobber
