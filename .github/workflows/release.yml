name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload assets to (e.g. v1.1.3)'
        required: true
        type: string

# Allow the workflow to upload release assets
permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config zip
      - name: Build (x86_64)
        run: |
          make clean
          make RELEASE=1 BACKEND=original
      - name: Package
        run: |
          mkdir -p dist/onec-linux-x86_64/lib dist/onec-linux-x86_64/include dist/onec-linux-x86_64/bin
          cp onec dist/onec-linux-x86_64/bin/
          cp README.MD dist/onec-linux-x86_64/
          cp examples/example5.nec dist/onec-linux-x86_64/
          cp libonec.a dist/onec-linux-x86_64/lib/
          cp src/opennec.h dist/onec-linux-x86_64/include/
          cp src/types.h dist/onec-linux-x86_64/include/
          cp src/deck.h dist/onec-linux-x86_64/include/
          cp src/input.h dist/onec-linux-x86_64/include/
          cp src/output.h dist/onec-linux-x86_64/include/
          cp src/geometry.h dist/onec-linux-x86_64/include/
          cp src/control.h dist/onec-linux-x86_64/include/
          cp src/fields.h dist/onec-linux-x86_64/include/
          cp src/ground.h dist/onec-linux-x86_64/include/
          cp src/calculations.h dist/onec-linux-x86_64/include/
          cp src/matrix.h dist/onec-linux-x86_64/include/
          cp src/network.h dist/onec-linux-x86_64/include/
          cp src/radiation.h dist/onec-linux-x86_64/include/
          cp src/somnec.h dist/onec-linux-x86_64/include/
          cp src/misc.h dist/onec-linux-x86_64/include/
          cp -r docs dist/onec-linux-x86_64/
          cp -r examples dist/onec-linux-x86_64/
          cd dist && zip -r onec-linux-x86_64.zip onec-linux-x86_64/
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" dist/onec-linux-x86_64.zip --clobber

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config zip
      - name: Build (aarch64)
        run: |
          make clean
          make RELEASE=1 BACKEND=original
      - name: Package
        run: |
          mkdir -p dist/onec-linux-aarch64/lib dist/onec-linux-aarch64/include dist/onec-linux-aarch64/bin
          cp onec dist/onec-linux-aarch64/bin/
          cp README.MD dist/onec-linux-aarch64/
          cp examples/example5.nec dist/onec-linux-aarch64/
          cp libonec.a dist/onec-linux-aarch64/lib/
          cp src/opennec.h dist/onec-linux-aarch64/include/
          cp src/types.h dist/onec-linux-aarch64/include/
          cp src/deck.h dist/onec-linux-aarch64/include/
          cp src/input.h dist/onec-linux-aarch64/include/
          cp src/output.h dist/onec-linux-aarch64/include/
          cp src/geometry.h dist/onec-linux-aarch64/include/
          cp src/control.h dist/onec-linux-aarch64/include/
          cp src/fields.h dist/onec-linux-aarch64/include/
          cp src/ground.h dist/onec-linux-aarch64/include/
          cp src/calculations.h dist/onec-linux-aarch64/include/
          cp src/matrix.h dist/onec-linux-aarch64/include/
          cp src/network.h dist/onec-linux-aarch64/include/
          cp src/radiation.h dist/onec-linux-aarch64/include/
          cp src/somnec.h dist/onec-linux-aarch64/include/
          cp src/misc.h dist/onec-linux-aarch64/include/
          cp -r docs dist/onec-linux-aarch64/
          cp -r examples dist/onec-linux-aarch64/
          cd dist && zip -r onec-linux-aarch64.zip onec-linux-aarch64/
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" dist/onec-linux-aarch64.zip --clobber

  build-macos-x86:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (macOS x86_64)
        run: |
          make clean
          make RELEASE=1 CC=clang CFLAGS="-I. -Isrc -O2 -Wall -Wno-unused-parameter -arch x86_64 -mmacosx-version-min=11.0" LDFLAGS="-arch x86_64 -mmacosx-version-min=11.0" BACKEND=original
      - name: Package
        run: |
          mkdir -p dist/onec-macos-x86/lib dist/onec-macos-x86/include dist/onec-macos-x86/bin
          cp onec dist/onec-macos-x86/bin/
          cp README.MD dist/onec-macos-x86/
          cp examples/example5.nec dist/onec-macos-x86/
          cp libonec.a dist/onec-macos-x86/lib/
          cp src/opennec.h dist/onec-macos-x86/include/
          cp src/types.h dist/onec-macos-x86/include/
          cp src/deck.h dist/onec-macos-x86/include/
          cp src/input.h dist/onec-macos-x86/include/
          cp src/output.h dist/onec-macos-x86/include/
          cp src/geometry.h dist/onec-macos-x86/include/
          cp src/control.h dist/onec-macos-x86/include/
          cp src/fields.h dist/onec-macos-x86/include/
          cp src/ground.h dist/onec-macos-x86/include/
          cp src/calculations.h dist/onec-macos-x86/include/
          cp src/matrix.h dist/onec-macos-x86/include/
          cp src/network.h dist/onec-macos-x86/include/
          cp src/radiation.h dist/onec-macos-x86/include/
          cp src/somnec.h dist/onec-macos-x86/include/
          cp src/misc.h dist/onec-macos-x86/include/
          cp -r docs dist/onec-macos-x86/
          cp -r examples dist/onec-macos-x86/
          cd dist && zip -r onec-macos-x86.zip onec-macos-x86/
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" dist/onec-macos-x86.zip --clobber

  build-macos-arm64:
    runs-on: macos-latest
    name: Build macOS (arm64)
    steps:
      - uses: actions/checkout@v4
      - name: Show runner arch
        run: |
          uname -m || true
          sysctl -n hw.machine || true
      - name: Build (macOS arm64)
        run: |
          make clean
          make RELEASE=1 CC=clang CFLAGS="-I. -Isrc -O2 -Wall -Wno-unused-parameter -arch arm64 -mmacosx-version-min=11.0" LDFLAGS="-arch arm64 -mmacosx-version-min=11.0" BACKEND=original
      - name: Package
        run: |
          mkdir -p dist/onec-macos-arm64/lib dist/onec-macos-arm64/include dist/onec-macos-arm64/bin
          cp onec dist/onec-macos-arm64/bin/
          cp README.MD dist/onec-macos-arm64/
          cp examples/example5.nec dist/onec-macos-arm64/
          cp libonec.a dist/onec-macos-arm64/lib/
          cp src/opennec.h dist/onec-macos-arm64/include/
          cp src/types.h dist/onec-macos-arm64/include/
          cp src/deck.h dist/onec-macos-arm64/include/
          cp src/input.h dist/onec-macos-arm64/include/
          cp src/output.h dist/onec-macos-arm64/include/
          cp src/geometry.h dist/onec-macos-arm64/include/
          cp src/control.h dist/onec-macos-arm64/include/
          cp src/fields.h dist/onec-macos-arm64/include/
          cp src/ground.h dist/onec-macos-arm64/include/
          cp src/calculations.h dist/onec-macos-arm64/include/
          cp src/matrix.h dist/onec-macos-arm64/include/
          cp src/network.h dist/onec-macos-arm64/include/
          cp src/radiation.h dist/onec-macos-arm64/include/
          cp src/somnec.h dist/onec-macos-arm64/include/
          cp src/misc.h dist/onec-macos-arm64/include/
          cp -r docs dist/onec-macos-arm64/
          cp -r examples dist/onec-macos-arm64/
          cd dist && zip -r onec-macos-arm64.zip onec-macos-arm64/
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" dist/onec-macos-arm64.zip --clobber

  build-windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2/MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openblas
            pkgconf
            make
      - name: Build (MINGW64)
        shell: bash -l {0}
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          make clean
          make RELEASE=1 LDFLAGS="-static" CC=x86_64-w64-mingw32-gcc BACKEND=original
      - name: Package
        shell: bash -l {0}
        run: |
          mkdir -p dist/onec-windows-x86_64/lib dist/onec-windows-x86_64/include dist/onec-windows-x86_64/bin
          cp onec.exe dist/onec-windows-x86_64/bin/
          cp README.MD dist/onec-windows-x86_64/
          cp examples/example5.nec dist/onec-windows-x86_64/
          cp libonec.a dist/onec-windows-x86_64/lib/
          cp src/opennec.h dist/onec-windows-x86_64/include/
          cp src/types.h dist/onec-windows-x86_64/include/
          cp src/deck.h dist/onec-windows-x86_64/include/
          cp src/input.h dist/onec-windows-x86_64/include/
          cp src/output.h dist/onec-windows-x86_64/include/
          cp src/geometry.h dist/onec-windows-x86_64/include/
          cp src/control.h dist/onec-windows-x86_64/include/
          cp src/fields.h dist/onec-windows-x86_64/include/
          cp src/ground.h dist/onec-windows-x86_64/include/
          cp src/calculations.h dist/onec-windows-x86_64/include/
          cp src/matrix.h dist/onec-windows-x86_64/include/
          cp src/network.h dist/onec-windows-x86_64/include/
          cp src/radiation.h dist/onec-windows-x86_64/include/
          cp src/somnec.h dist/onec-windows-x86_64/include/
          cp src/misc.h dist/onec-windows-x86_64/include/
          cp -r docs dist/onec-windows-x86_64/
          cp -r examples dist/onec-windows-x86_64/
          powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/onec-windows-x86_64/*' -DestinationPath 'dist/onec-windows-x86_64.zip' -Force"
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -l {0}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" dist/onec-windows-x86_64.zip --clobber
