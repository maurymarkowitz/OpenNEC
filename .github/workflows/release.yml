name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload assets to (e.g. v1.1.3)'
        required: true
        type: string

# Allow the workflow to upload release assets
permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config zip
      - name: Build (x86_64)
        run: |
          make clean
          make BACKEND=original
      - name: Package
        run: |
          mkdir -p dist
          zip -j dist/onec-linux-x86_64.zip onec README.MD test/example5.deck
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" dist/onec-linux-x86_64.zip --clobber

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config zip
      - name: Build (aarch64)
        run: |
          make clean
          make BACKEND=original
      - name: Package
        run: |
          mkdir -p dist
          zip -j dist/onec-linux-aarch64.zip onec README.MD test/example5.deck
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" dist/onec-linux-aarch64.zip --clobber

  build-macos-x86:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (macOS x86_64)
        env:
          CFLAGS: '-arch x86_64 -mmacosx-version-min=10.15'
          LDFLAGS: '-arch x86_64 -mmacosx-version-min=10.15'
        run: |
          make clean
          make CC=clang CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" BACKEND=original
      - name: Package
        run: |
          mkdir -p dist
          zip -j dist/onec-macos-x86.zip onec README.MD test/example5.deck
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" dist/onec-macos-x86.zip --clobber

  build-macos-arm64:
    runs-on: macos-latest
    name: Build macOS (arm64)
    steps:
      - uses: actions/checkout@v4
      - name: Show runner arch
        run: |
          uname -m || true
          sysctl -n hw.machine || true
      - name: Build (macOS arm64)
        env:
          CFLAGS: '-arch arm64 -mmacosx-version-min=11.0'
          LDFLAGS: '-arch arm64 -mmacosx-version-min=11.0'
        run: |
          make clean
          make CC=clang CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" BACKEND=original
      - name: Package
        run: |
          mkdir -p dist
          zip -j dist/onec-macos-arm64.zip onec README.MD test/example5.deck
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" dist/onec-macos-arm64.zip --clobber

  build-windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2/MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-openblas
            pkgconf
            make
            zip
      - name: Build (MINGW64)
        shell: bash -l {0}
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          make clean
          make CC=x86_64-w64-mingw32-gcc BACKEND=original
      - name: Package
        shell: bash -l {0}
        run: |
          mkdir -p dist
          zip -j dist/onec-windows-x86_64.zip onec.exe README.MD test/example5.deck
      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash -l {0}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name }}" dist/onec-windows-x86_64.zip --clobber
