name: Update Scoop Manifest

on:
  release:
    types: [published]

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout scoop bucket
        uses: actions/checkout@v4
        with:
          repository: maurymarkowitz/scoop-bucket
          token: ${{ secrets.SCOOP_TOKEN }}
          path: bucket

      - name: Download Windows release asset
        run: |
          VERSION=${{ github.event.release.tag_name }}
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${VERSION}/onec-windows-x86_64.zip"
          curl -L -o onec-windows-x86_64.zip "$RELEASE_URL"

      - name: Compute SHA256
        run: |
          HASH=$(sha256sum onec-windows-x86_64.zip | cut -d ' ' -f1)
          echo "HASH=$HASH" >> $GITHUB_ENV

      - name: Update manifest
        run: |
          VERSION=${{ github.event.release.tag_name }}
          # Remove leading 'v' from version if present
          VERSION=${VERSION#v}
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" bucket/bucket/onec.json
          sed -i "s/\"hash\": \".*\"/\"hash\": \"${HASH}\"/" bucket/bucket/onec.json
          sed -i "s|releases/download/.*/onec-windows-x86_64.zip|releases/download/${{ github.event.release.tag_name }}/onec-windows-x86_64.zip|" bucket/bucket/onec.json

      - name: Commit changes
        run: |
          cd bucket
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Update scoop manifest for ${{ github.event.release.tag_name }}"
          git push