name: Update Scoop Manifest

on:
  release:
    types: [published]

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout scoop bucket
        uses: actions/checkout@v4
        with:
          repository: maurymarkowitz/scoop-bucket
          token: ${{ secrets.SCOOP_TOKEN }}
          path: bucket

      - name: Download release asset
        run: |
          curl -L -o onec.zip ${{ github.event.release.assets[0].browser_download_url }}

      - name: Compute SHA256
        run: |
          HASH=$(sha256sum onec.zip | cut -d ' ' -f1)
          echo "HASH=$HASH" >> $GITHUB_ENV

      - name: Update manifest
        run: |
          VERSION=${{ github.event.release.tag_name }}
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" bucket/bucket/onec.json
          sed -i "s/\"hash\": \".*\"/\"hash\": \"$HASH\"/" bucket/bucket/onec.json
          sed -i "s|releases/download/.*/onec-windows-amd64.zip|releases/download/$VERSION/onec-windows-amd64.zip|" bucket/bucket/onec.json

      - name: Commit changes
        run: |
          cd bucket
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Update scoop manifest for $VERSION"
          git push